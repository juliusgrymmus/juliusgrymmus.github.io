<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>3D Multiplayer World</title>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #87ceeb;

      font-family: Arial, sans-serif;
    }

    #game {
      width: 100%;
      height: 100%;
    }

    #info {
      position: fixed;

      top: 15px;
      left: 15px;

      z-index: 10;

      padding: 12px 16px;

      background: rgba(0, 0, 0, 0.65);

      color: white;

      border-radius: 10px;

      user-select: none;

      backdrop-filter: blur(5px);
    }

    #players {
      color: #8cff8c;
    }

    #status {
      margin-top: 5px;

      font-size: 13px;

      color: #aaa;
    }

    #start {
      position: fixed;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      z-index: 20;

      padding: 20px 30px;

      border: none;

      border-radius: 12px;

      background: rgba(20, 20, 20, 0.9);

      color: white;

      font-size: 20px;

      cursor: pointer;

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.4);
    }

    #start:hover {
      background: rgba(40, 40, 40, 0.95);
    }

  </style>


  <!--
    Import map
    Gör att Three.js addons fungerar direkt
  -->

  <script type="importmap">
  {
    "imports": {
      "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

      "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

</head>


<body>


  <div id="game"></div>


  <div id="info">

    <b>🌍 3D Multiplayer</b>

    <br><br>

    WASD = gå

    <br>

    SPACE = hoppa

    <br>

    Mus = titta

    <br><br>

    <span id="players">
      Spelare: 1
    </span>

    <div id="status">
      Ansluter...
    </div>

  </div>


  <button id="start">
    KLICKA FÖR ATT SPELA
  </button>


  <!-- Supabase -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>


  <script type="module">


    import * as THREE from "three";

    import {
      PointerLockControls
    } from "three/addons/controls/PointerLockControls.js";


    // ============================================================
    // SUPABASE
    // ============================================================

    // ============================================================
    // VIKTIGT:
    // BEHÅLL DINA EGNA VÄRDEN HÄR
    // ============================================================

    const SUPABASE_URL =
      "https://vdlezuortcobvypkhfnn.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_KGwlKLA38h3LVlZIWBfnsQ_496oon4z";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ============================================================
    // SPELAR-ID
    // ============================================================

    const playerId =
      crypto.randomUUID();


    // ============================================================
    // THREE.JS SCENE
    // ============================================================

    const scene =
      new THREE.Scene();


    // Himmel

    scene.background =
      new THREE.Color(
        0x87ceeb
      );


    // Dimma

    scene.fog =
      new THREE.Fog(
        0x87ceeb,
        100,
        900
      );


    // ============================================================
    // KAMERA
    // ============================================================

    const camera =
      new THREE.PerspectiveCamera(
        75,

        window.innerWidth /
        window.innerHeight,

        0.1,

        5000
      );


    camera.position.set(
      0,
      1.7,
      0
    );


    // ============================================================
    // RENDERER
    // ============================================================

    const renderer =
      new THREE.WebGLRenderer({
        antialias: true
      });


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );


    renderer.shadowMap.enabled =
      true;


    renderer.shadowMap.type =
      THREE.PCFSoftShadowMap;


    document
      .getElementById("game")
      .appendChild(
        renderer.domElement
      );


    // ============================================================
    // LJUS
    // ============================================================

    const ambientLight =
      new THREE.HemisphereLight(
        0xbde7ff,
        0x4b6338,
        2
      );


    scene.add(
      ambientLight
    );


    const sun =
      new THREE.DirectionalLight(
        0xffffff,
        2.5
      );


    sun.position.set(
      150,
      250,
      100
    );


    sun.castShadow =
      true;


    sun.shadow.mapSize.width =
      2048;

    sun.shadow.mapSize.height =
      2048;


    sun.shadow.camera.left =
      -300;

    sun.shadow.camera.right =
      300;

    sun.shadow.camera.top =
      300;

    sun.shadow.camera.bottom =
      -300;


    scene.add(
      sun
    );


    // ============================================================
    // FINARE GRÄS
    // ============================================================

    /*
      Vi skapar en liten gräs-textur direkt i JavaScript.
      Därför behöver du inte ladda upp någon bild.
    */

    const grassCanvas =
      document.createElement(
        "canvas"
      );


    grassCanvas.width =
      256;

    grassCanvas.height =
      256;


    const grassContext =
      grassCanvas.getContext(
        "2d"
      );


    // Basfärg

    grassContext.fillStyle =
      "#4f9f3f";


    grassContext.fillRect(
      0,
      0,
      256,
      256
    );


    // Små grässtrån

    for (
      let i = 0;
      i < 1800;
      i++
    ) {

      const x =
        Math.random() * 256;

      const y =
        Math.random() * 256;


      const length =
        2 +
        Math.random() * 8;


      const green =
        80 +
        Math.floor(
          Math.random() * 70
        );


      grassContext.strokeStyle =
        `rgb(
          ${30 + Math.floor(Math.random() * 30)},
          ${green},
          ${30 + Math.floor(Math.random() * 30)}
        )`;


      grassContext.lineWidth =
        0.7;


      grassContext.beginPath();

      grassContext.moveTo(
        x,
        y
      );

      grassContext.lineTo(
        x +
        (Math.random() - 0.5) * 3,

        y -
        length
      );

      grassContext.stroke();

    }


    const grassTexture =
      new THREE.CanvasTexture(
        grassCanvas
      );


    grassTexture.wrapS =
      THREE.RepeatWrapping;


    grassTexture.wrapT =
      THREE.RepeatWrapping;


    grassTexture.repeat.set(
      250,
      250
    );


    grassTexture.colorSpace =
      THREE.SRGBColorSpace;


    const grassMaterial =
      new THREE.MeshStandardMaterial({
        map: grassTexture,

        roughness: 1
      });


    const grassGeometry =
      new THREE.PlaneGeometry(
        5000,
        5000
      );


    const grass =
      new THREE.Mesh(
        grassGeometry,
        grassMaterial
      );


    grass.rotation.x =
      -Math.PI / 2;


    grass.receiveShadow =
      true;


    scene.add(
      grass
    );


    // ============================================================
    // LITE GRÄSDETALJER
    // ============================================================

    /*
      Små grässtrån nära spelaren.
      Detta ger mer djup utan att skapa tusentals objekt.
    */

    const grassBladeMaterial =
      new THREE.MeshBasicMaterial({
        color: 0x3f8f35,
        side: THREE.DoubleSide
      });


    const bladeGeometry =
      new THREE.BufferGeometry();


    const bladePositions = [];


    for (
      let i = 0;
      i < 900;
      i++
    ) {

      const x =
        (Math.random() - 0.5) *
        250;

      const z =
        (Math.random() - 0.5) *
        250;


      const height =
        0.15 +
        Math.random() * 0.35;


      bladePositions.push(
        x,
        0,
        z,

        x,
        height,
        z
      );

    }


    bladeGeometry.setAttribute(
      "position",

      new THREE.Float32BufferAttribute(
        bladePositions,
        3
      )
    );


    const grassBlades =
      new THREE.LineSegments(
        bladeGeometry,
        grassBladeMaterial
      );


    scene.add(
      grassBlades
    );


    // ============================================================
    // FIRST PERSON
    // ============================================================

    const controls =
      new PointerLockControls(
        camera,
        document.body
      );


    document
      .getElementById("start")
      .addEventListener(
        "click",

        () => {

          controls.lock();

        }
      );


    controls.addEventListener(
      "lock",

      () => {

        document
          .getElementById("start")
          .style.display =
          "none";

      }
    );


    controls.addEventListener(
      "unlock",

      () => {

        document
          .getElementById("start")
          .style.display =
          "block";

      }
    );


    // ============================================================
    // ANDRA SPELARE
    // ============================================================

    const otherPlayers = {};


    function createPlayer() {

      const group =
        new THREE.Group();


      // Kropp

      const bodyGeometry =
        new THREE.CapsuleGeometry(
          0.35,
          1.0,
          4,
          8
        );


      const bodyMaterial =
        new THREE.MeshStandardMaterial({
          color: 0x3366ff,
          roughness: 0.7
        });


      const body =
        new THREE.Mesh(
          bodyGeometry,
          bodyMaterial
        );


      body.position.y =
        0.9;


      body.castShadow =
        true;


      group.add(
        body
      );


      // Huvud

      const headGeometry =
        new THREE.SphereGeometry(
          0.28,
          16,
          16
        );


      const headMaterial =
        new THREE.MeshStandardMaterial({
          color: 0xffcc99,
          roughness: 0.8
        });


      const head =
        new THREE.Mesh(
          headGeometry,
          headMaterial
        );


      head.position.y =
        1.65;


      head.castShadow =
        true;


      group.add(
        head
      );


      scene.add(
        group
      );


      return group;

    }


    // ============================================================
    // UPPDATERA ANNAN SPELARE
    // ============================================================

    function updatePlayer(
      id,
      data
    ) {

      if (
        id === playerId
      )
        return;


      if (
        !otherPlayers[id]
      ) {

        otherPlayers[id] =
          createPlayer();


        otherPlayers[id]
          .position.set(
            data.x,
            0,
            data.z
          );


        otherPlayers[id]
          .userData.targetX =
          data.x;


        otherPlayers[id]
          .userData.targetZ =
          data.z;


        otherPlayers[id]
          .userData.targetRotation =
          data.rotation || 0;


        return;

      }


      const player =
        otherPlayers[id];


      // Spara målet

      player.userData.targetX =
        data.x;


      player.userData.targetZ =
        data.z;


      player.userData.targetRotation =
        data.rotation || 0;

    }


    // ============================================================
    // TA BORT SPELARE
    // ============================================================

    function removePlayer(
      id
    ) {

      if (
        !otherPlayers[id]
      )
        return;


      scene.remove(
        otherPlayers[id]
      );


      delete otherPlayers[id];

    }


    // ============================================================
    // SUPABASE REALTIME
    // ============================================================

    const channel =
      supabaseClient.channel(
        "game-world",

        {
          config: {

            presence: {
              key: playerId
            },

            broadcast: {
              self: false
            }

          }

        }
      );


    // ============================================================
    // PRESENCE SYNC
    // ============================================================

    channel.on(

      "presence",

      {
        event: "sync"
      },

      () => {

        const state =
          channel.presenceState();


        for (
          const id in otherPlayers
        ) {

          if (
            !state[id]
          ) {

            removePlayer(
              id
            );

          }

        }


        for (
          const id in state
        ) {

          if (
            id === playerId
          )
            continue;


          const entries =
            state[id];


          if (
            entries &&
            entries.length > 0
          ) {

            updatePlayer(
              id,
              entries[0]
            );

          }

        }


        updatePlayerCount();

      }

    );


    // ============================================================
    // NY SPELARE
    // ============================================================

    channel.on(

      "presence",

      {
        event: "join"
      },

      ({
        key,
        newPresences
      }) => {

        if (
          key === playerId
        )
          return;


        if (
          newPresences &&
          newPresences.length
        ) {

          updatePlayer(
            key,
            newPresences[0]
          );

        }


        updatePlayerCount();

      }

    );


    // ============================================================
    // SPELARE LÄMNAR
    // ============================================================

    channel.on(

      "presence",

      {
        event: "leave"
      },

      ({
        key
      }) => {

        removePlayer(
          key
        );


        updatePlayerCount();

      }

    );


    // ============================================================
    // POSITION BROADCAST
    // ============================================================

    channel.on(

      "broadcast",

      {
        event: "move"
      },

      ({
        payload
      }) => {

        if (
          payload.id === playerId
        )
          return;


        updatePlayer(
          payload.id,
          payload
        );

      }

    );


    // ============================================================
    // ANSLUT TILL WORLD
    // ============================================================

    channel.subscribe(

      async (status) => {

        if (
          status === "SUBSCRIBED"
        ) {

          document
            .getElementById("status")
            .textContent =
            "Multiplayer ansluten!";


          await channel.track({

            x:
              camera.position.x,

            z:
              camera.position.z,

            rotation:
              camera.rotation.y

          });

        }

      }

    );


    // ============================================================
    // SPELARRÄKNARE
    // ============================================================

    function updatePlayerCount() {

      const state =
        channel.presenceState();


      const count =
        Object.keys(state).length;


      document
        .getElementById("players")
        .textContent =
        "Spelare: " + count;

    }


    // ============================================================
    // TANGENTBORD
    // ============================================================

    const keys = {

      w: false,
      a: false,
      s: false,
      d: false,

      space: false

    };


    document.addEventListener(

      "keydown",

      (event) => {

        if (
          event.key === "w" ||
          event.key === "W"
        ) {

          keys.w = true;

        }


        if (
          event.key === "a" ||
          event.key === "A"
        ) {

          keys.a = true;

        }


        if (
          event.key === "s" ||
          event.key === "S"
        ) {

          keys.s = true;

        }


        if (
          event.key === "d" ||
          event.key === "D"
        ) {

          keys.d = true;

        }


        if (
          event.code === "Space"
        ) {

          event.preventDefault();

          keys.space = true;

        }

      }

    );


    document.addEventListener(

      "keyup",

      (event) => {

        if (
          event.key === "w" ||
          event.key === "W"
        ) {

          keys.w = false;

        }


        if (
          event.key === "a" ||
          event.key === "A"
        ) {

          keys.a = false;

        }


        if (
          event.key === "s" ||
          event.key === "S"
        ) {

          keys.s = false;

        }


        if (
          event.key === "d" ||
          event.key === "D"
        ) {

          keys.d = false;

        }


        if (
          event.code === "Space"
        ) {

          keys.space = false;

        }

      }

    );


    // ============================================================
    // RÖRELSE
    // ============================================================

    const clock =
      new THREE.Clock();


    const velocity =
      new THREE.Vector3();


    const direction =
      new THREE.Vector3();


    const moveSpeed =
      8;


    const gravity =
      22;


    const jumpStrength =
      8;


    let verticalVelocity =
      0;


    let onGround =
      true;


    // ============================================================
    // MOVE PLAYER
    // ============================================================

    function movePlayer(
      delta
    ) {

      if (
        !controls.isLocked
      )
        return;


      // ----------------------------------------------------------
      // HOPPA
      // ----------------------------------------------------------

      if (
        keys.space &&
        onGround
      ) {

        verticalVelocity =
          jumpStrength;

        onGround =
          false;

      }


      // ----------------------------------------------------------
      // GRAVITATION
      // ----------------------------------------------------------

      verticalVelocity -=
        gravity * delta;


      camera.position.y +=
        verticalVelocity * delta;


      // Marknivå

      if (
        camera.position.y <= 1.7
      ) {

        camera.position.y =
          1.7;

        verticalVelocity =
          0;

        onGround =
          true;

      }


      // ----------------------------------------------------------
      // RÖRELSE
      // ----------------------------------------------------------

      direction.set(
        0,
        0,
        0
      );


      if (keys.w)
        direction.z -= 1;


      if (keys.s)
        direction.z += 1;


      if (keys.a)
        direction.x -= 1;


      if (keys.d)
        direction.x += 1;


      if (
        direction.lengthSq() > 0
      ) {

        direction.normalize();


        velocity.x =
          direction.x *
          moveSpeed;

        velocity.z =
          direction.z *
          moveSpeed;


        controls.moveRight(
          velocity.x * delta
        );


        controls.moveForward(
          -velocity.z * delta
        );

      }

    }


    // ============================================================
    // SKICKA POSITION
    // ============================================================

    let sendTimer =
      0;


    async function sendPosition() {

      if (
        !controls.isLocked
      )
        return;


      await channel.send({

        type:
          "broadcast",

        event:
          "move",

        payload: {

          id:
            playerId,

          x:
            camera.position.x,

          z:
            camera.position.z,

          rotation:
            camera.rotation.y

        }

      });

    }


    // ============================================================
    // SMOOTH MULTIPLAYER
    // ============================================================

    function smoothOtherPlayers(
      delta
    ) {

      for (
        const id in otherPlayers
      ) {

        const player =
          otherPlayers[id];


        if (
          player.userData.targetX ===
          undefined
        ) {

          continue;

        }


        /*
          Smooth interpolation.

          Detta gör att andra spelare
          inte hoppar mellan positioner.
        */

        const smooth =
          1 -
          Math.pow(
            0.001,
            delta
          );


        player.position.x +=

          (
            player.userData.targetX -
            player.position.x
          ) * smooth;


        player.position.z +=

          (
            player.userData.targetZ -
            player.position.z
          ) * smooth;


        // --------------------------------------------------------
        // SMOOTH ROTATION
        // --------------------------------------------------------

        const targetRotation =
          player.userData.targetRotation;


        let rotationDifference =
          targetRotation -
          player.rotation.y;


        rotationDifference =
          Math.atan2(

            Math.sin(
              rotationDifference
            ),

            Math.cos(
              rotationDifference
            )

          );


        player.rotation.y +=

          rotationDifference *
          smooth;

      }

    }


    // ============================================================
    // GAME LOOP
    // ============================================================

    function animate() {

      requestAnimationFrame(
        animate
      );


      const delta =
        Math.min(
          clock.getDelta(),
          0.05
        );


      // Egen spelare

      movePlayer(
        delta
      );


      // Andra spelare

      smoothOtherPlayers(
        delta
      );


      // Skicka position

      sendTimer +=
        delta;


      if (
        sendTimer >
        0.08
      ) {

        sendTimer =
          0;


        sendPosition();

      }


      // Render

      renderer.render(
        scene,
        camera
      );

    }


    animate();


    // ============================================================
    // WINDOW RESIZE
    // ============================================================

    window.addEventListener(

      "resize",

      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

          window.innerWidth,

          window.innerHeight

        );

      }

    );


  </script>

</body>

</html>
