<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Multiplayer</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      background: #87ceeb;
    }

    canvas {
      display: block;
    }

    #info {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 10;
      color: white;
      background: rgba(0,0,0,0.45);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      user-select: none;
    }

    #start {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0,0,0,0.45);
      color: white;
      cursor: pointer;
      text-align: center;
    }

    #start h1 {
      font-size: 40px;
      margin: 0 0 10px;
    }

    #start p {
      font-size: 18px;
    }

    .nametag {
      color: white;
      background: rgba(0,0,0,0.65);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
      text-shadow: 0 1px 2px black;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

  <div id="info">
    Spelare: <span id="playerCount">1</span>
  </div>

  <div id="start">
    <h1>🌳 3D Multiplayer</h1>
    <p>Klicka för att spela</p>
    <p>WASD = gå · SPACE = hoppa · ESC = mus</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script type="module">

    import * as THREE from "three";
    import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";


    // =====================================================
    // SUPABASE
    // =====================================================

    const SUPABASE_URL =
      "https://vdlezuortcobvypkhfnn.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_KGwlKLA38h3LVlZIWBfnsQ_496oon4z";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // =====================================================
    // SPELARENS NAMN
    // =====================================================

    let playerName = prompt("Vad heter du?");

    if (!playerName || playerName.trim() === "") {
      playerName = "Spelare";
    }

    playerName = playerName.substring(0, 16);


    // =====================================================
    // THREE.JS
    // =====================================================

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x87ceeb);

    scene.fog = new THREE.Fog(
      0x87ceeb,
      300,
      1800
    );


    // =====================================================
    // KAMERA
    // =====================================================

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      3000
    );

    camera.position.set(
      0,
      1.7,
      0
    );


    // =====================================================
    // RENDERER
    // =====================================================

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.shadowMap.enabled = true;

    document.body.appendChild(
      renderer.domElement
    );


    // =====================================================
    // LJUS
    // =====================================================

    const hemisphereLight =
      new THREE.HemisphereLight(
        0xffffff,
        0x4b7a35,
        1.5
      );

    scene.add(hemisphereLight);


    const sun =
      new THREE.DirectionalLight(
        0xffffff,
        2
      );

    sun.position.set(
      200,
      300,
      100
    );

    sun.castShadow = true;

    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;

    sun.shadow.camera.left = -500;
    sun.shadow.camera.right = 500;
    sun.shadow.camera.top = 500;
    sun.shadow.camera.bottom = -500;

    scene.add(sun);


    // =====================================================
    // GRÄS
    // =====================================================

    const grassCanvas =
      document.createElement("canvas");

    grassCanvas.width = 256;
    grassCanvas.height = 256;

    const grassCtx =
      grassCanvas.getContext("2d");

    grassCtx.fillStyle = "#4f8f3a";
    grassCtx.fillRect(
      0,
      0,
      256,
      256
    );

    for (let i = 0; i < 5000; i++) {

      const x =
        Math.random() * 256;

      const y =
        Math.random() * 256;

      const brightness =
        45 + Math.random() * 40;

      grassCtx.fillStyle =
        `rgb(${30 + brightness / 5},
             ${90 + brightness},
             ${25 + brightness / 4})`;

      grassCtx.fillRect(
        x,
        y,
        1,
        2
      );
    }

    const grassTexture =
      new THREE.CanvasTexture(
        grassCanvas
      );

    grassTexture.wrapS =
      THREE.RepeatWrapping;

    grassTexture.wrapT =
      THREE.RepeatWrapping;

    grassTexture.repeat.set(
      250,
      250
    );


    const ground =
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          5000,
          5000
        ),
        new THREE.MeshStandardMaterial({
          map: grassTexture
        })
      );

    ground.rotation.x =
      -Math.PI / 2;

    ground.receiveShadow = true;

    scene.add(ground);


    // =====================================================
    // PLAYER
    // =====================================================

    const controls =
      new PointerLockControls(
        camera,
        document.body
      );


    // =====================================================
    // TANGENTER
    // =====================================================

    const keys = {
      forward: false,
      backward: false,
      left: false,
      right: false
    };

    let jumpPressed = false;


    document.addEventListener(
      "keydown",
      (event) => {

        if (event.code === "KeyW")
          keys.forward = true;

        if (event.code === "KeyS")
          keys.backward = true;

        if (event.code === "KeyA")
          keys.left = true;

        if (event.code === "KeyD")
          keys.right = true;

        if (
          event.code === "Space" &&
          !event.repeat
        ) {
          jumpPressed = true;
        }
      }
    );


    document.addEventListener(
      "keyup",
      (event) => {

        if (event.code === "KeyW")
          keys.forward = false;

        if (event.code === "KeyS")
          keys.backward = false;

        if (event.code === "KeyA")
          keys.left = false;

        if (event.code === "KeyD")
          keys.right = false;
      }
    );


    // =====================================================
    // START
    // =====================================================

    const startScreen =
      document.getElementById("start");

    startScreen.addEventListener(
      "click",
      () => {

        controls.lock();

      }
    );

    controls.addEventListener(
      "lock",
      () => {

        startScreen.style.display =
          "none";

      }
    );

    controls.addEventListener(
      "unlock",
      () => {

        startScreen.style.display =
          "flex";

      }
    );


    // =====================================================
    // EGEN SPELARE
    // =====================================================

    let velocityY = 0;

    let onGround = true;

    const moveSpeed = 8;

    const gravity = 22;

    const jumpStrength = 8;


    // =====================================================
    // ID
    // =====================================================

    const playerId =
      crypto.randomUUID();


    // =====================================================
    // ANDRA SPELARE
    // =====================================================

    const otherPlayers = {};


    // =====================================================
    // NAMETAG
    // =====================================================

    function createNametag(name) {

      const canvas =
        document.createElement("canvas");

      canvas.width = 512;
      canvas.height = 128;

      const ctx =
        canvas.getContext("2d");

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.font =
        "bold 52px Arial";

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillStyle =
        "rgba(0,0,0,0.65)";

      ctx.fillRect(
        45,
        20,
        422,
        88
      );

      ctx.fillStyle =
        "white";

      ctx.fillText(
        name,
        256,
        64
      );

      const texture =
        new THREE.CanvasTexture(
          canvas
        );

      texture.minFilter =
        THREE.LinearFilter;

      const material =
        new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          depthTest: false
        });

      const sprite =
        new THREE.Sprite(material);

      sprite.scale.set(
        2.8,
        0.7,
        1
      );

      return sprite;
    }


    // =====================================================
    // SKAPA ANDRA SPELARE
    // =====================================================

    function createPlayer(
      id,
      name
    ) {

      const group =
        new THREE.Group();


      // Kropp

      const body =
        new THREE.Mesh(
          new THREE.CapsuleGeometry(
            0.35,
            0.8,
            4,
            8
          ),
          new THREE.MeshStandardMaterial({
            color: 0x2979ff
          })
        );

      body.position.y =
        0.9;

      body.castShadow = true;

      group.add(body);


      // Huvud

      const head =
        new THREE.Mesh(
          new THREE.SphereGeometry(
            0.32,
            16,
            16
          ),
          new THREE.MeshStandardMaterial({
            color: 0xffc7a0
          })
        );

      head.position.y =
        1.75;

      head.castShadow = true;

      group.add(head);


      // Nametag

      const nametag =
        createNametag(
          name || "Spelare"
        );

      nametag.position.y =
        2.35;

      group.add(nametag);


      scene.add(group);


      group.userData = {

        targetX: 0,
        targetY: 0,
        targetZ: 0,

        targetRotation: 0,

        targetName: name || "Spelare"

      };


      otherPlayers[id] =
        group;

    }


    // =====================================================
    // UPPDATERA SPELARE
    // =====================================================

    function updatePlayer(
      id,
      data
    ) {

      if (id === playerId)
        return;


      if (!otherPlayers[id]) {

        createPlayer(
          id,
          data.name
        );

      }


      const player =
        otherPlayers[id];


      player.userData.targetX =
        data.x;

      player.userData.targetY =
        data.y;

      player.userData.targetZ =
        data.z;

      player.userData.targetRotation =
        data.rotation;


      if (
        data.name &&
        data.name !==
        player.userData.targetName
      ) {

        player.userData.targetName =
          data.name;

      }

    }


    // =====================================================
    // SMOOTH REMOTE PLAYERS
    // =====================================================

    function smoothOtherPlayers(
      delta
    ) {

      const smooth =
        1 - Math.pow(
          0.001,
          delta
        );


      for (
        const id in otherPlayers
      ) {

        const player =
          otherPlayers[id];


        player.position.x +=
          (
            player.userData.targetX -
            player.position.x
          ) * smooth;


        player.position.y +=
          (
            player.userData.targetY -
            player.position.y
          ) * smooth;


        player.position.z +=
          (
            player.userData.targetZ -
            player.position.z
          ) * smooth;


        let targetRotation =
          player.userData.targetRotation;


        let difference =
          targetRotation -
          player.rotation.y;


        while (
          difference > Math.PI
        ) {
          difference -=
            Math.PI * 2;
        }

        while (
          difference < -Math.PI
        ) {
          difference +=
            Math.PI * 2;
        }


        player.rotation.y +=
          difference * smooth;

      }

    }


    // =====================================================
    // SUPABASE REALTIME
    // =====================================================

    const channel =
      supabaseClient.channel(
        "game-world",
        {
          config: {
            presence: {
              key: playerId
            }
          }
        }
      );


    // =====================================================
    // PRESENCE SYNC
    // =====================================================

    channel.on(
      "presence",
      {
        event: "sync"
      },
      () => {

        const state =
          channel.presenceState();

        for (
          const id in state
        ) {

          if (
            id === playerId
          )
            continue;


          const presence =
            state[id]?.[0];

          if (presence) {

            updatePlayer(
              id,
              presence
            );

          }

        }

        updatePlayerCount(
          Object.keys(state).length
        );

      }
    );


    // =====================================================
    // NY SPELARE
    // =====================================================

    channel.on(
      "presence",
      {
        event: "join"
      },
      ({ newPresences }) => {

        for (
          const presence
          of newPresences
        ) {

          if (
            presence.playerId ===
            playerId
          )
            continue;


          updatePlayer(
            presence.playerId,
            presence
          );

        }

        updatePlayerCount();

      }
    );


    // =====================================================
    // SPELARE LÄMNAR
    // =====================================================

    channel.on(
      "presence",
      {
        event: "leave"
      },
      ({ leftPresences }) => {

        for (
          const presence
          of leftPresences
        ) {

          const id =
            presence.playerId;


          if (
            otherPlayers[id]
          ) {

            scene.remove(
              otherPlayers[id]
            );

            delete otherPlayers[id];

          }

        }

        updatePlayerCount();

      }
    );


    // =====================================================
    // MOVEMENT BROADCAST
    // =====================================================

    channel.on(
      "broadcast",
      {
        event: "move"
      },
      ({ payload }) => {

        if (
          payload.id ===
          playerId
        )
          return;


        updatePlayer(
          payload.id,
          payload
        );

      }
    );


    // =====================================================
    // ANSLUT
    // =====================================================

    channel.subscribe(
      async (status) => {

        if (
          status === "SUBSCRIBED"
        ) {

          await channel.track({

            playerId:

              playerId,

            name:

              playerName,

            x:

              camera.position.x,

            y:

              camera.position.y -
              1.7,

            z:

              camera.position.z,

            rotation:

              camera.rotation.y

          });

        }

      }
    );


    // =====================================================
    // SKICKA POSITION
    // =====================================================

    let lastBroadcast =
      0;


    function broadcastMovement(
      time
    ) {

      if (
        time - lastBroadcast <
        80
      ) {
        return;
      }


      lastBroadcast =
        time;


      channel.send({

        type: "broadcast",

        event: "move",

        payload: {

          id:
            playerId,

          name:
            playerName,

          x:
            camera.position.x,

          y:
            camera.position.y - 1.7,

          z:
            camera.position.z,

          rotation:
            camera.rotation.y

        }

      });

    }


    // =====================================================
    // PLAYER COUNT
    // =====================================================

    function updatePlayerCount(
      count
    ) {

      if (
        count === undefined
      ) {

        const state =
          channel.presenceState();

        count =
          Object.keys(state).length;

      }


      document.getElementById(
        "playerCount"
      ).textContent =
        count;

    }


    // =====================================================
    // GAME LOOP
    // =====================================================

    let previousTime =
      performance.now();


    function animate(
      time
    ) {

      requestAnimationFrame(
        animate
      );


      const delta =
        Math.min(
          (time - previousTime) /
          1000,
          0.05
        );


      previousTime =
        time;


      // -------------------------
      // MOVEMENT
      // -------------------------

      if (
        controls.isLocked
      ) {

        let moveX = 0;
        let moveZ = 0;


        if (keys.forward)
          moveZ += 1;

        if (keys.backward)
          moveZ -= 1;

        if (keys.left)
          moveX -= 1;

        if (keys.right)
          moveX += 1;


        const length =
          Math.sqrt(
            moveX * moveX +
            moveZ * moveZ
          );


        if (length > 0) {

          moveX /= length;
          moveZ /= length;


          controls.moveRight(
            moveX *
            moveSpeed *
            delta
          );

          controls.moveForward(
            moveZ *
            moveSpeed *
            delta
          );

        }


        // -------------------------
        // HOPP
        // -------------------------

        if (
          jumpPressed &&
          onGround
        ) {

          velocityY =
            jumpStrength;

          onGround =
            false;

        }

        jumpPressed =
          false;


        velocityY -=
          gravity * delta;


        camera.position.y +=
          velocityY * delta;


        if (
          camera.position.y <= 1.7
        ) {

          camera.position.y =
            1.7;

          velocityY =
            0;

          onGround =
            true;

        }

      }


      // -------------------------
      // ANDRA SPELARE
      // -------------------------

      smoothOtherPlayers(
        delta
      );


      // -------------------------
      // BROADCAST
      // -------------------------

      broadcastMovement(
        time
      );


      // -------------------------
      // RENDER
      // -------------------------

      renderer.render(
        scene,
        camera
      );

    }


    animate(
      performance.now()
    );


    // =====================================================
    // RESIZE
    // =====================================================

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>
