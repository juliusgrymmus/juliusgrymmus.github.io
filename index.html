<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>3D Multiplayer World</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #87ceeb;
      font-family: Arial, sans-serif;
    }

    #game {
      width: 100%;
      height: 100%;
    }

    #info {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 10;

      padding: 12px 16px;

      background: rgba(0, 0, 0, 0.65);
      color: white;

      border-radius: 10px;

      user-select: none;
    }

    #start {
      position: fixed;
      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      z-index: 20;

      padding: 20px 30px;

      border: none;
      border-radius: 12px;

      background: #222;
      color: white;

      font-size: 20px;
      cursor: pointer;
    }

    #status {
      margin-top: 5px;
      font-size: 13px;
      color: #aaa;
    }
  </style>

  <!-- Import map så Three.js-moduler fungerar direkt i webbläsaren -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

  <div id="game"></div>

  <div id="info">
    <b>3D Multiplayer</b><br>
    WASD = gå<br>
    Mus = titta<br>
    <span id="players">Spelare: 1</span>
    <div id="status">Ansluter...</div>
  </div>

  <button id="start">
    KLICKA FÖR ATT SPELA
  </button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script type="module">

    import * as THREE from "three";
    import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";


    // ============================================================
    // SUPABASE
    // ============================================================

    // BYT UT DESSA TVÅ
    const SUPABASE_URL = "DIN_SUPABASE_URL";
    const SUPABASE_KEY = "DIN_SUPABASE_PUBLISHABLE_KEY";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // ============================================================
    // SPELAR-ID
    // ============================================================

    const playerId =
      crypto.randomUUID();


    // ============================================================
    // THREE.JS
    // ============================================================

    const scene =
      new THREE.Scene();

    scene.background =
      new THREE.Color(0x87ceeb);


    // Kamera

    const camera =
      new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        5000
      );


    // Renderer

    const renderer =
      new THREE.WebGLRenderer({
        antialias: true
      });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    document
      .getElementById("game")
      .appendChild(renderer.domElement);


    // ============================================================
    // LJUS
    // ============================================================

    const ambientLight =
      new THREE.AmbientLight(
        0xffffff,
        1.5
      );

    scene.add(ambientLight);


    const sun =
      new THREE.DirectionalLight(
        0xffffff,
        2
      );

    sun.position.set(
      100,
      200,
      100
    );

    scene.add(sun);


    // ============================================================
    // GRÄSMARK
    // ============================================================

    const grassGeometry =
      new THREE.PlaneGeometry(
        5000,
        5000
      );

    const grassMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x3d9b35
      });

    const grass =
      new THREE.Mesh(
        grassGeometry,
        grassMaterial
      );

    grass.rotation.x =
      -Math.PI / 2;

    scene.add(grass);


    // ============================================================
    // GRID
    // ============================================================

    const grid =
      new THREE.GridHelper(
        5000,
        500,
        0x267026,
        0x267026
      );

    grid.position.y = 0.01;

    scene.add(grid);


    // ============================================================
    // FÖRSTAPERSONSKAMERA
    // ============================================================

    const controls =
      new PointerLockControls(
        camera,
        document.body
      );

    camera.position.set(
      0,
      1.7,
      0
    );


    document
      .getElementById("start")
      .addEventListener(
        "click",
        () => {

          controls.lock();

        }
      );


    controls.addEventListener(
      "lock",
      () => {

        document
          .getElementById("start")
          .style.display = "none";

      }
    );


    controls.addEventListener(
      "unlock",
      () => {

        document
          .getElementById("start")
          .style.display = "block";

      }
    );


    // ============================================================
    // ANDRA SPELARE
    // ============================================================

    const otherPlayers = {};


    function createPlayer() {

      const group =
        new THREE.Group();


      // kropp

      const bodyGeometry =
        new THREE.CapsuleGeometry(
          0.35,
          1.0,
          4,
          8
        );

      const bodyMaterial =
        new THREE.MeshStandardMaterial({
          color: 0x3366ff
        });

      const body =
        new THREE.Mesh(
          bodyGeometry,
          bodyMaterial
        );

      body.position.y =
        0.9;

      group.add(body);


      // huvud

      const headGeometry =
        new THREE.SphereGeometry(
          0.28,
          16,
          16
        );

      const headMaterial =
        new THREE.MeshStandardMaterial({
          color: 0xffcc99
        });

      const head =
        new THREE.Mesh(
          headGeometry,
          headMaterial
        );

      head.position.y =
        1.65;

      group.add(head);


      scene.add(group);

      return group;
    }


    function updatePlayer(
      id,
      data
    ) {

      if (id === playerId)
        return;


      if (!otherPlayers[id]) {

        otherPlayers[id] =
          createPlayer();

      }


      const player =
        otherPlayers[id];


      player.position.x =
        data.x;

      player.position.y =
        0;

      player.position.z =
        data.z;

      player.rotation.y =
        data.rotation || 0;

    }


    function removePlayer(id) {

      if (!otherPlayers[id])
        return;


      scene.remove(
        otherPlayers[id]
      );

      delete otherPlayers[id];

    }


    // ============================================================
    // SUPABASE REALTIME
    // ============================================================

    const channel =
      supabaseClient.channel(
        "game-world",
        {
          config: {

            presence: {
              key: playerId
            },

            broadcast: {
              self: false
            }

          }
        }
      );


    // När hela spelarlistan synkroniseras

    channel.on(
      "presence",
      {
        event: "sync"
      },
      () => {

        const state =
          channel.presenceState();


        // Ta bort gamla spelare

        for (
          const id in otherPlayers
        ) {

          if (!state[id]) {

            removePlayer(id);

          }

        }


        // Lägg till alla spelare

        for (
          const id in state
        ) {

          if (id === playerId)
            continue;


          const entries =
            state[id];


          if (
            entries &&
            entries.length > 0
          ) {

            updatePlayer(
              id,
              entries[0]
            );

          }

        }


        updatePlayerCount();

      }
    );


    // Ny spelare

    channel.on(
      "presence",
      {
        event: "join"
      },
      ({ key, newPresences }) => {

        if (
          key === playerId
        )
          return;


        if (
          newPresences &&
          newPresences.length
        ) {

          updatePlayer(
            key,
            newPresences[0]
          );

        }

        updatePlayerCount();

      }
    );


    // Spelare lämnar

    channel.on(
      "presence",
      {
        event: "leave"
      },
      ({ key }) => {

        removePlayer(key);

        updatePlayerCount();

      }
    );


    // Snabba positionsuppdateringar

    channel.on(
      "broadcast",
      {
        event: "move"
      },
      ({ payload }) => {

        if (
          payload.id === playerId
        )
          return;


        updatePlayer(
          payload.id,
          payload
        );

      }
    );


    // Anslut

    channel.subscribe(
      async (status) => {

        if (
          status === "SUBSCRIBED"
        ) {

          document
            .getElementById("status")
            .textContent =
            "Multiplayer ansluten!";


          await channel.track({

            x: camera.position.x,

            z: camera.position.z,

            rotation: camera.rotation.y

          });

        }

      }
    );


    // ============================================================
    // SPELARRÄKNARE
    // ============================================================

    function updatePlayerCount() {

      const state =
        channel.presenceState();

      let count =
        Object.keys(state).length;

      document
        .getElementById("players")
        .textContent =
        "Spelare: " + count;

    }


    // ============================================================
    // TANGENTBORD
    // ============================================================

    const keys = {

      w: false,
      a: false,
      s: false,
      d: false

    };


    document.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "w" ||
          event.key === "W"
        )
          keys.w = true;


        if (
          event.key === "a" ||
          event.key === "A"
        )
          keys.a = true;


        if (
          event.key === "s" ||
          event.key === "S"
        )
          keys.s = true;


        if (
          event.key === "d" ||
          event.key === "D"
        )
          keys.d = true;

      }
    );


    document.addEventListener(
      "keyup",
      (event) => {

        if (
          event.key === "w" ||
          event.key === "W"
        )
          keys.w = false;


        if (
          event.key === "a" ||
          event.key === "A"
        )
          keys.a = false;


        if (
          event.key === "s" ||
          event.key === "S"
        )
          keys.s = false;


        if (
          event.key === "d" ||
          event.key === "D"
        )
          keys.d = false;

      }
    );


    // ============================================================
    // RÖRELSE
    // ============================================================

    const clock =
      new THREE.Clock();


    let sendTimer = 0;


    function movePlayer(
      delta
    ) {

      if (
        !controls.isLocked
      )
        return;


      const speed =
        8;


      if (keys.w)
        controls.moveForward(
          speed * delta
        );


      if (keys.s)
        controls.moveForward(
          -speed * delta
        );


      if (keys.a)
        controls.moveRight(
          -speed * delta
        );


      if (keys.d)
        controls.moveRight(
          speed * delta
        );


      // Håll kameran på marknivå

      camera.position.y =
        1.7;

    }


    // ============================================================
    // SKICKA POSITION TILL ANDRA SPELARE
    // ============================================================

    async function sendPosition() {

      if (
        !controls.isLocked
      )
        return;


      await channel.send({

        type: "broadcast",

        event: "move",

        payload: {

          id: playerId,

          x: camera.position.x,

          z: camera.position.z,

          rotation:
            camera.rotation.y

        }

      });

    }


    // ============================================================
    // GAME LOOP
    // ============================================================

    function animate() {

      requestAnimationFrame(
        animate
      );


      const delta =
        clock.getDelta();


      movePlayer(
        delta
      );


      sendTimer += delta;


      // ungefär 10 positionsuppdateringar/sekund

      if (
        sendTimer > 0.1
      ) {

        sendTimer = 0;

        sendPosition();

      }


      renderer.render(
        scene,
        camera
      );

    }


    animate();


    // ============================================================
    // FÖNSTERSTORLEK
    // ============================================================

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>
